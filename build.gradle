plugins {
    id 'maven-publish'
    id 'java-library'
    id 'jacoco'
}

group = 'ar.fdelbo.jpos'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://jpos.org/maven' }
}

dependencies {
    implementation 'org.springframework:spring-context:6.1.11'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:3.3.2'
    implementation 'org.jpos:jpos:2.1.9'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

test {
    useJUnitPlatform()
}

def jacocoExclude = [
        'ar/fdelbo/jpos/config/**',
        'ar/fdelbo/jpos/custom/**',
        'ar/fdelbo/jpos/exception/**',
        'ar/fdelbo/jpos/service/NetworkManagementService.*'
]

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclude)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclude)
        }))
    }

    violationRules {
        rule {
            limit {
                minimum = 0.95 //Please, do not decrease this value
            }
        }
    }
}
